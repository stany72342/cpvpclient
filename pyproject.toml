[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpvpclient"
version = "0.1.0"
description = "Client-side packet timing optimizer for crystal and anchor PvP flows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "cpvpclient"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
